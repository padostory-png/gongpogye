name: 공포계 daily

on:
  schedule:
    - cron: "40 22 * * 1-5"   # UTC 22:40 = 한국 07:40 (월~금, 전날 미국장 마감 후)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python fetch.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: commit data
        run: |
          git config user.name "gongpogye-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d)"
          git push
